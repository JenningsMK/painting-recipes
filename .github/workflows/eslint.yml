# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: ['development']
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ['development']
  schedule:
    - cron: '40 0 * * 1'

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install pnpm dependencies, cache them correctly
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install TypeScript-eslint/
        run: |
          pnpm install @typescript-eslint/parser@6.21.0
          pnpm install @typescript-eslint/eslint-plugin@7.6.0

      - name: Install ESLint
        run: |
          pnpm install eslint@8.57.0
          pnpm install @microsoft/eslint-formatter-sarif@2.1.7

      - name: Run ESLint
        run: pnpm dlx eslint .
          --format @microsoft/eslint-formatter-sarif
          --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
